<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahmad's Food Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #080810;
  --bg2:    #0f0f1a;
  --bg3:    #16161f;
  --bg4:    #1e1e2a;
  --bg5:    #252535;
  --neon-orange: #ff6b2b;
  --neon-pink:   #ff2d7a;
  --neon-yellow: #ffe000;
  --neon-teal:   #00e5c4;
  --neon-purple: #b44fff;
  --text:   #f4f0e8;
  --text2:  #8a8678;
  --text3:  #3e3c48;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* noise overlay */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity: 0.4;
}

/* glow blobs */
.blob {
  position: fixed; border-radius: 50%;
  filter: blur(90px); pointer-events: none; z-index: 0;
  opacity: 0.12;
}
.blob1 { width:400px; height:400px; top:-100px; left:-100px; background: var(--neon-orange); }
.blob2 { width:350px; height:350px; bottom:-80px; right:-80px; background: var(--neon-pink); }
.blob3 { width:300px; height:300px; top:50%; left:60%; background: var(--neon-teal); opacity:0.07; }

/* everything above blobs */
header, .stats-bar, .tabs-wrap, .main, .modal-overlay { position: relative; z-index: 1; }

/* HEADER */
header {
  text-align: center;
  padding: 52px 20px 30px;
}
.header-eyebrow {
  font-family: 'Syne', sans-serif;
  font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
  color: var(--neon-orange); font-weight: 600; margin-bottom: 12px;
}
h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(38px, 8vw, 72px);
  font-weight: 800; line-height: 0.95;
  letter-spacing: -2px;
}
h1 .w1 { color: var(--neon-yellow); }
h1 .w2 { color: var(--text); }
h1 .w3 {
  color: transparent;
  -webkit-text-stroke: 1.5px var(--neon-pink);
}
.header-sub {
  font-size: 13px; color: var(--text2);
  margin-top: 14px; letter-spacing: 2px;
}
.header-line {
  width: 60px; height: 3px;
  background: linear-gradient(to right, var(--neon-orange), var(--neon-pink));
  border-radius: 2px; margin: 18px auto 0;
}

/* STATS */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  max-width: 700px; margin: 0 auto 36px;
  padding: 0 16px; gap: 8px;
}
.stat-item {
  background: var(--bg2);
  border: 1px solid var(--bg4);
  border-radius: var(--radius);
  padding: 14px 8px; text-align: center;
  transition: border-color 0.2s;
}
.stat-item:hover { border-color: var(--bg5); }
.stat-num {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: 26px; font-weight: 700;
  line-height: 1;
}
.stat-num.s1 { color: var(--neon-orange); }
.stat-num.s2 { color: var(--neon-teal); }
.stat-num.s3 { color: var(--neon-yellow); }
.stat-num.s4 { color: var(--neon-purple); }
.stat-num.s5 { color: var(--neon-pink); }
.stat-lbl {
  display: block; font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text3); margin-top: 4px;
}

/* TABS */
.tabs-wrap {
  display: flex; justify-content: center; gap: 6px;
  padding: 0 16px; margin-bottom: 28px; flex-wrap: wrap;
}
.tab-btn {
  background: var(--bg2); border: 1px solid var(--bg4);
  color: var(--text2); font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  padding: 9px 18px; border-radius: 30px; cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 7px;
  text-transform: uppercase;
}
.tab-btn:hover { color: var(--text); border-color: var(--bg5); }
.tab-btn.t-restaurants.active { background: rgba(255,107,43,0.12); border-color: var(--neon-orange); color: var(--neon-orange); }
.tab-btn.t-desserts.active    { background: rgba(255,45,122,0.12); border-color: var(--neon-pink);   color: var(--neon-pink); }
.tab-btn.t-cafes.active       { background: rgba(255,224,0,0.10);  border-color: var(--neon-yellow); color: var(--neon-yellow); }
.tab-btn.t-street.active      { background: rgba(0,229,196,0.10);  border-color: var(--neon-teal);   color: var(--neon-teal); }
.tab-btn.t-caterers.active    { background: rgba(180,79,255,0.12); border-color: var(--neon-purple); color: var(--neon-purple); }
.tab-icon { font-size: 15px; }

/* MAIN */
.main { max-width: 960px; margin: 0 auto; padding: 0 16px 80px; }
.section { display: none; }
.section.active { display: block; }

/* FILTER ROW */
.filter-row {
  display: flex; gap: 10px; margin-bottom: 22px;
  align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 6px 14px; border-radius: 20px; font-size: 11px;
  letter-spacing: 1px; cursor: pointer; border: 1px solid transparent;
  transition: all 0.18s; font-weight: 500; text-transform: uppercase;
  font-family: 'DM Sans', sans-serif;
}
.pill.all      { background: var(--bg3); border-color: var(--bg5); color: var(--text2); }
.pill.been     { background: rgba(0,229,196,0.08);  border-color: rgba(0,229,196,0.2);  color: #00e5c4; }
.pill.want     { background: rgba(255,224,0,0.08);  border-color: rgba(255,224,0,0.2);  color: #ffe000; }
.pill.regular  { background: rgba(255,107,43,0.08); border-color: rgba(255,107,43,0.2); color: #ff6b2b; }
.pill.wouldnt  { background: rgba(255,45,122,0.08); border-color: rgba(255,45,122,0.2); color: #ff2d7a; }
.pill.active-filter, .pill:hover { filter: brightness(1.4); border-color: currentColor; }

.add-btn {
  background: var(--bg3); border: 1px solid var(--bg5);
  color: var(--text); font-family: 'Syne', sans-serif;
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  padding: 9px 20px; border-radius: 8px; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.add-btn:hover { background: var(--bg4); border-color: var(--text3); }

/* GRID */
.entries-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 12px;
}

/* CARD */
.entry-card {
  background: var(--bg2);
  border: 1px solid var(--bg4);
  border-radius: var(--radius);
  padding: 18px;
  transition: transform 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
}
.entry-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
}
.entry-card.been::after    { background: linear-gradient(to right, transparent, #00e5c4, transparent); }
.entry-card.want::after    { background: linear-gradient(to right, transparent, #ffe000, transparent); }
.entry-card.regular::after { background: linear-gradient(to right, transparent, #ff6b2b, transparent); }
.entry-card.wouldnt::after { background: linear-gradient(to right, transparent, #ff2d7a, transparent); }
.entry-card:hover { transform: translateY(-3px); border-color: var(--bg5); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 17px; font-weight: 700; color: var(--text);
  line-height: 1.2; flex: 1;
}
.card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
.entry-card:hover .card-actions { opacity: 1; }
.card-act-btn {
  background: var(--bg3); border: 1px solid var(--bg4);
  color: var(--text3); width: 28px; height: 28px;
  border-radius: 6px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.card-act-btn:hover { color: var(--text); border-color: var(--bg5); }
.card-act-btn.del:hover { color: var(--neon-pink); border-color: rgba(255,45,122,0.3); }

.card-meta {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center;
}
.status-badge {
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 3px 9px; border-radius: 20px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 4px;
}
.status-badge.been    { background: rgba(0,229,196,0.12);  color: #00e5c4; }
.status-badge.want    { background: rgba(255,224,0,0.1);   color: #ffe000; }
.status-badge.regular { background: rgba(255,107,43,0.12); color: #ff6b2b; }
.status-badge.wouldnt { background: rgba(255,45,122,0.12); color: #ff2d7a; }
.status-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

.price-badge {
  font-size: 11px; color: var(--text2);
  background: var(--bg3); border: 1px solid var(--bg4);
  padding: 2px 8px; border-radius: 6px;
}

.card-location {
  font-size: 12px; color: var(--text2); margin-bottom: 8px;
  display: flex; align-items: center; gap: 5px;
}
.card-location::before { content: '📍'; font-size: 11px; }

.card-rating { display: flex; gap: 2px; margin-bottom: 8px; }
.star { font-size: 14px; color: var(--text3); cursor: pointer; transition: color 0.1s; }
.star.filled { color: var(--neon-yellow); }
.star:hover { color: var(--neon-yellow); }

.card-ordered {
  font-size: 12px; color: var(--text2); margin-bottom: 8px;
  padding: 7px 10px; background: var(--bg3);
  border-radius: 8px; border: 1px solid var(--bg4);
  display: flex; align-items: flex-start; gap: 6px;
}
.card-ordered::before { content: '🍽️'; font-size: 12px; flex-shrink: 0; margin-top: 1px; }

.card-thoughts {
  font-size: 13px; color: var(--text2); line-height: 1.6;
  font-style: italic; border-top: 1px solid var(--bg4);
  padding-top: 9px; margin-top: 4px;
}

.empty-state {
  grid-column: 1 / -1; text-align: center; padding: 64px 20px; color: var(--text3);
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; font-family: 'Syne', sans-serif; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--bg5);
  border-radius: 16px; padding: 28px 26px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  animation: modalIn 0.25s cubic-bezier(0.34,1.3,0.64,1) forwards;
}
@keyframes modalIn {
  from { opacity:0; transform: scale(0.88) translateY(24px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}
.modal-title {
  font-family: 'Syne', sans-serif; font-size: 20px;
  font-weight: 800; color: var(--text); margin-bottom: 22px;
  text-transform: uppercase; letter-spacing: 1px;
}
.modal-title span { color: var(--neon-orange); }

.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text3); margin-bottom: 6px;
  font-weight: 500; font-family: 'Syne', sans-serif;
}
.form-input, .form-select, .form-textarea {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--bg4); border-radius: 8px;
  color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 14px; padding: 10px 14px;
  transition: border-color 0.2s; outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--bg5); }
.form-select option { background: var(--bg3); }
.form-textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.rating-input { display: flex; gap: 6px; }
.rating-star {
  font-size: 22px; color: var(--text3); cursor: pointer;
  transition: color 0.1s; user-select: none;
}
.rating-star.filled { color: var(--neon-yellow); }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-save {
  flex: 1; background: var(--neon-orange);
  border: none; color: #000;
  font-family: 'Syne', sans-serif; font-size: 13px;
  font-weight: 800; padding: 12px; border-radius: 8px;
  cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px; text-transform: uppercase;
}
.btn-save:hover { background: #ff8550; }
.btn-cancel {
  background: var(--bg3); border: 1px solid var(--bg4);
  color: var(--text2); font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 600; padding: 12px 20px;
  border-radius: 8px; cursor: pointer; transition: all 0.2s;
  text-transform: uppercase; letter-spacing: 1px;
}
.btn-cancel:hover { border-color: var(--bg5); color: var(--text); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <p class="header-eyebrow">Ahmad's Food Diary</p>
  <h1><span class="w1">Food</span> <span class="w2">&</span> <span class="w3">Places</span></h1>
  <p class="header-sub">Restaurants · Desserts · Cafes · Street Food · Caterers</p>
  <div class="header-line"></div>
</header>

<div class="stats-bar">
  <div class="stat-item"><span class="stat-num s1" id="st-total">0</span><span class="stat-lbl">Total</span></div>
  <div class="stat-item"><span class="stat-num s2" id="st-been">0</span><span class="stat-lbl">Visited</span></div>
  <div class="stat-item"><span class="stat-num s3" id="st-want">0</span><span class="stat-lbl">Want to Go</span></div>
  <div class="stat-item"><span class="stat-num s4" id="st-regular">0</span><span class="stat-lbl">Regulars</span></div>
  <div class="stat-item"><span class="stat-num s5" id="st-wouldnt">0</span><span class="stat-lbl">Wouldn't Return</span></div>
</div>

<div class="tabs-wrap">
  <button class="tab-btn t-restaurants active" onclick="switchTab('restaurants',this)"><span class="tab-icon">🍽️</span> Restaurants</button>
  <button class="tab-btn t-desserts"    onclick="switchTab('desserts',this)"><span class="tab-icon">🍰</span> Desserts</button>
  <button class="tab-btn t-cafes"       onclick="switchTab('cafes',this)"><span class="tab-icon">☕</span> Cafes</button>
  <button class="tab-btn t-street"      onclick="switchTab('street',this)"><span class="tab-icon">🌮</span> Street Food</button>
  <button class="tab-btn t-caterers"    onclick="switchTab('caterers',this)"><span class="tab-icon">🤌</span> Caterers</button>
</div>

<div class="main">
  <div id="sec-restaurants" class="section active"></div>
  <div id="sec-desserts"    class="section"></div>
  <div id="sec-cafes"       class="section"></div>
  <div id="sec-street"      class="section"></div>
  <div id="sec-caterers"    class="section"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <p class="modal-title" id="modal-title">Add <span id="modal-cat-label">Place</span></p>
    <input type="hidden" id="edit-id"/>
    <input type="hidden" id="edit-cat"/>

    <div class="form-group">
      <label class="form-label">Name of Place</label>
      <input class="form-input" id="f-title" type="text" placeholder="e.g. Nando's, Crumbl Cookies..."/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="f-status">
          <option value="been">Been Here</option>
          <option value="want">Want to Visit</option>
          <option value="regular">Regular Spot</option>
          <option value="wouldnt">Wouldn't Go Back</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Price Range</label>
        <select class="form-select" id="f-price">
          <option value="">— Select —</option>
          <option value="$">$ Budget</option>
          <option value="$$">$$ Mid-range</option>
          <option value="$$$">$$$ Pricey</option>
          <option value="$$$$">$$$$ Luxury</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Location / Area</label>
      <input class="form-input" id="f-location" type="text" placeholder="e.g. Bridgetown, St. Michael..."/>
    </div>

    <div class="form-group">
      <label class="form-label">What You Ordered</label>
      <input class="form-input" id="f-ordered" type="text" placeholder="e.g. Jerk chicken, brownie sundae..."/>
    </div>

    <div class="form-group">
      <label class="form-label">Rating</label>
      <div class="rating-input" id="rating-input">
        <span class="rating-star" data-v="1">★</span>
        <span class="rating-star" data-v="2">★</span>
        <span class="rating-star" data-v="3">★</span>
        <span class="rating-star" data-v="4">★</span>
        <span class="rating-star" data-v="5">★</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Your Thoughts</label>
      <textarea class="form-textarea" id="f-thoughts" placeholder="Was it worth it? What stood out?"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<script>
var data = { restaurants:[], desserts:[], cafes:[], street:[], caterers:[] };
var currentTab = 'restaurants';
var currentFilter = { restaurants:'all', desserts:'all', cafes:'all', street:'all', caterers:'all' };
var editRating = 0;
var editingId = null;

var statusLabels = { been:'Been Here', want:'Want to Visit', regular:'Regular Spot', wouldnt:"Won't Return" };
var tabLabels = { restaurants:'Restaurant', desserts:'Dessert Place', cafes:'Cafe', street:'Street Food Spot', caterers:'Caterer' };
var tabIcons  = { restaurants:'🍽️', desserts:'🍰', cafes:'☕', street:'🌮', caterers:'🤌' };

function load() {
  try { var s = localStorage.getItem('ahmads-food'); if (s) data = JSON.parse(s); } catch(e) {}
}
function save() {
  try { localStorage.setItem('ahmads-food', JSON.stringify(data)); } catch(e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function switchTab(cat, btn) {
  currentTab = cat;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('sec-'+cat).classList.add('active');
  renderSection(cat);
}

function setFilter(cat, status, el) {
  currentFilter[cat] = status;
  el.closest('.filter-pills').querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active-filter'); });
  el.classList.add('active-filter');
  renderSection(cat);
}

function renderSection(cat) {
  var sec = document.getElementById('sec-'+cat);
  var filter = currentFilter[cat];
  var entries = data[cat];
  var filtered = filter === 'all' ? entries : entries.filter(function(e){ return e.status === filter; });

  var html = '<div class="filter-row">';
  html += '<div class="filter-pills">';
  ['all','been','want','regular','wouldnt'].forEach(function(s){
    var labels = { all:'All', been:'Visited', want:'Want to Go', regular:'Regular', wouldnt:"Won't Return" };
    var cls = 'pill ' + (s==='all'?'all':s) + (currentFilter[cat]===s?' active-filter':'');
    html += '<span class="'+cls+'" onclick="setFilter(\''+cat+'\',\''+s+'\',this)">'+labels[s]+'</span>';
  });
  html += '</div>';
  html += '<button class="add-btn" onclick="openModal(\''+cat+'\',null)">+ Add</button>';
  html += '</div><div class="entries-grid">';

  if (!filtered.length) {
    html += '<div class="empty-state"><div class="empty-icon">'+tabIcons[cat]+'</div><p>No '+tabLabels[cat].toLowerCase()+'s logged yet</p></div>';
  } else {
    filtered.forEach(function(e){ html += renderCard(e, cat); });
  }
  html += '</div>';
  sec.innerHTML = html;
  updateStats();
}

function renderCard(e, cat) {
  var stars = '';
  for (var i=1;i<=5;i++) stars += '<span class="star'+(i<=e.rating?' filled':'')+'" onclick="quickRate(\''+cat+'\',\''+e.id+'\','+i+')">★</span>';

  return '<div class="entry-card '+e.status+'">' +
    '<div class="card-top">' +
      '<div class="card-title">'+esc(e.title)+'</div>' +
      '<div class="card-actions">' +
        '<button class="card-act-btn" onclick="openModal(\''+cat+'\',\''+e.id+'\')">✎</button>' +
        '<button class="card-act-btn del" onclick="deleteEntry(\''+cat+'\',\''+e.id+'\')">✕</button>' +
      '</div>' +
    '</div>' +
    '<div class="card-meta">' +
      '<span class="status-badge '+e.status+'"><span class="status-dot"></span>'+statusLabels[e.status]+'</span>' +
      (e.price ? '<span class="price-badge">'+esc(e.price)+'</span>' : '') +
    '</div>' +
    (e.location ? '<div class="card-location">'+esc(e.location)+'</div>' : '') +
    '<div class="card-rating">'+stars+'</div>' +
    (e.ordered ? '<div class="card-ordered">'+esc(e.ordered)+'</div>' : '') +
    (e.thoughts ? '<div class="card-thoughts">'+esc(e.thoughts)+'</div>' : '') +
  '</div>';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(cat, id) {
  editingId = id;
  document.getElementById('edit-cat').value = cat;
  document.getElementById('modal-cat-label').textContent = tabLabels[cat];

  if (id) {
    var e = data[cat].find(function(x){ return x.id===id; });
    document.getElementById('f-title').value    = e.title;
    document.getElementById('f-status').value   = e.status;
    document.getElementById('f-price').value    = e.price || '';
    document.getElementById('f-location').value = e.location || '';
    document.getElementById('f-ordered').value  = e.ordered || '';
    document.getElementById('f-thoughts').value = e.thoughts || '';
    editRating = e.rating || 0;
  } else {
    document.getElementById('f-title').value    = '';
    document.getElementById('f-status').value   = 'been';
    document.getElementById('f-price').value    = '';
    document.getElementById('f-location').value = '';
    document.getElementById('f-ordered').value  = '';
    document.getElementById('f-thoughts').value = '';
    editRating = 0;
  }
  updateRatingStars(editRating);
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('f-title').focus(); }, 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

document.getElementById('modal-overlay').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});

document.querySelectorAll('.rating-star').forEach(function(star){
  star.addEventListener('click', function(){
    editRating = parseInt(this.getAttribute('data-v'));
    updateRatingStars(editRating);
  });
  star.addEventListener('mouseover', function(){
    updateRatingStars(parseInt(this.getAttribute('data-v')));
  });
});
document.getElementById('rating-input').addEventListener('mouseleave', function(){
  updateRatingStars(editRating);
});

function updateRatingStars(val) {
  document.querySelectorAll('.rating-star').forEach(function(s){
    s.classList.toggle('filled', parseInt(s.getAttribute('data-v')) <= val);
  });
}

function saveEntry() {
  var cat = document.getElementById('edit-cat').value;
  var title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  var entry = {
    id: editingId || uid(),
    title: title,
    status: document.getElementById('f-status').value,
    price: document.getElementById('f-price').value,
    location: document.getElementById('f-location').value.trim(),
    ordered: document.getElementById('f-ordered').value.trim(),
    rating: editRating,
    thoughts: document.getElementById('f-thoughts').value.trim()
  };
  if (editingId) {
    var idx = data[cat].findIndex(function(e){ return e.id===editingId; });
    if (idx > -1) data[cat][idx] = entry;
  } else {
    data[cat].unshift(entry);
  }
  save(); closeModal(); renderSection(cat);
}

function deleteEntry(cat, id) {
  data[cat] = data[cat].filter(function(e){ return e.id!==id; });
  save(); renderSection(cat);
}

function quickRate(cat, id, r) {
  var e = data[cat].find(function(x){ return x.id===id; });
  if (e) { e.rating = r; save(); renderSection(cat); }
}

function updateStats() {
  var all = [].concat(data.restaurants, data.desserts, data.cafes, data.street, data.caterers);
  document.getElementById('st-total').textContent   = all.length;
  document.getElementById('st-been').textContent    = all.filter(function(e){ return e.status==='been'; }).length;
  document.getElementById('st-want').textContent    = all.filter(function(e){ return e.status==='want'; }).length;
  document.getElementById('st-regular').textContent = all.filter(function(e){ return e.status==='regular'; }).length;
  document.getElementById('st-wouldnt').textContent = all.filter(function(e){ return e.status==='wouldnt'; }).length;
}

load();
renderSection('restaurants');
</script>
</body>
</html>
