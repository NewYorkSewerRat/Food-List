<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ahmad's Food Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#080810;--bg2:#0f0f1a;--bg3:#16161f;--bg4:#1e1e2a;--bg5:#252535;
  --neon-orange:#ff6b2b;--neon-pink:#ff2d7a;--neon-yellow:#ffe000;
  --neon-teal:#00e5c4;--neon-purple:#b44fff;
  --text:#f4f0e8;--text2:#8a8678;--text3:#3e3c48;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:0.12;}
.blob1{width:400px;height:400px;top:-100px;left:-100px;background:var(--neon-orange);}
.blob2{width:350px;height:350px;bottom:-80px;right:-80px;background:var(--neon-pink);}
.blob3{width:300px;height:300px;top:50%;left:60%;background:var(--neon-teal);opacity:0.07;}
header,.stats-bar,.tabs-wrap,.main,.modal-overlay,.lightbox{position:relative;z-index:1;}

/* HEADER */
header{text-align:center;padding:52px 20px 30px;}
.header-eyebrow{font-family:'Syne',sans-serif;font-size:11px;letter-spacing:6px;text-transform:uppercase;color:var(--neon-orange);font-weight:600;margin-bottom:12px;}
h1{font-family:'Syne',sans-serif;font-size:clamp(38px,8vw,72px);font-weight:800;line-height:0.95;letter-spacing:-2px;}
h1 .w1{color:var(--neon-yellow);}h1 .w2{color:var(--text);}
h1 .w3{color:transparent;-webkit-text-stroke:1.5px var(--neon-pink);}
.header-sub{font-size:13px;color:var(--text2);margin-top:14px;letter-spacing:2px;}
.header-line{width:60px;height:3px;background:linear-gradient(to right,var(--neon-orange),var(--neon-pink));border-radius:2px;margin:18px auto 0;}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);max-width:700px;margin:0 auto 36px;padding:0 16px;gap:8px;}
.stat-item{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:14px 8px;text-align:center;}
.stat-num{display:block;font-family:'Syne',sans-serif;font-size:26px;font-weight:700;line-height:1;}
.stat-num.s1{color:var(--neon-orange);}
.stat-num.s2{color:var(--neon-teal);}
.stat-num.s3{color:var(--neon-yellow);}
.stat-num.s4{color:var(--neon-purple);}
.stat-num.s5{color:var(--neon-pink);}
.stat-lbl{display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-top:4px;}

/* TABS */
.tabs-wrap{display:flex;justify-content:center;gap:6px;padding:0 16px;margin-bottom:28px;flex-wrap:wrap;}
.tab-btn{background:var(--bg2);border:1px solid var(--bg4);color:var(--text2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;letter-spacing:1px;padding:9px 18px;border-radius:30px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;text-transform:uppercase;}
.tab-btn:hover{color:var(--text);border-color:var(--bg5);}
.tab-btn.t-restaurants.active{background:rgba(255,107,43,.12);border-color:var(--neon-orange);color:var(--neon-orange);}
.tab-btn.t-desserts.active{background:rgba(255,45,122,.12);border-color:var(--neon-pink);color:var(--neon-pink);}
.tab-btn.t-cafes.active{background:rgba(255,224,0,.10);border-color:var(--neon-yellow);color:var(--neon-yellow);}
.tab-btn.t-street.active{background:rgba(0,229,196,.10);border-color:var(--neon-teal);color:var(--neon-teal);}
.tab-btn.t-caterers.active{background:rgba(180,79,255,.12);border-color:var(--neon-purple);color:var(--neon-purple);}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:0 16px 80px;}
.section{display:none;}.section.active{display:block;}

/* FILTER ROW */
.filter-row{display:flex;gap:10px;margin-bottom:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:6px 14px;border-radius:20px;font-size:11px;letter-spacing:1px;cursor:pointer;border:1px solid transparent;transition:all .18s;font-weight:500;text-transform:uppercase;}
.pill.all{background:var(--bg3);border-color:var(--bg5);color:var(--text2);}
.pill.been{background:rgba(0,229,196,.08);border-color:rgba(0,229,196,.2);color:#00e5c4;}
.pill.want{background:rgba(255,224,0,.08);border-color:rgba(255,224,0,.2);color:#ffe000;}
.pill.regular{background:rgba(255,107,43,.08);border-color:rgba(255,107,43,.2);color:#ff6b2b;}
.pill.wouldnt{background:rgba(255,45,122,.08);border-color:rgba(255,45,122,.2);color:#ff2d7a;}
.pill.active-filter,.pill:hover{filter:brightness(1.4);border-color:currentColor;}
.add-btn{background:var(--bg3);border:1px solid var(--bg5);color:var(--text);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:9px 20px;border-radius:8px;cursor:pointer;transition:all .2s;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.add-btn:hover{background:var(--bg4);}

/* GRID */
.entries-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}

/* CARD */
.entry-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s;position:relative;}
.entry-card:hover{transform:translateY(-3px);border-color:var(--bg5);}
.entry-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;}
.entry-card.been::after{background:linear-gradient(to right,transparent,#00e5c4,transparent);}
.entry-card.want::after{background:linear-gradient(to right,transparent,#ffe000,transparent);}
.entry-card.regular::after{background:linear-gradient(to right,transparent,#ff6b2b,transparent);}
.entry-card.wouldnt::after{background:linear-gradient(to right,transparent,#ff2d7a,transparent);}

/* PHOTO STRIP */
.card-photos{display:flex;gap:4px;padding:4px;background:var(--bg3);overflow-x:auto;scrollbar-width:none;}
.card-photos:empty{display:none;}
.card-photos::-webkit-scrollbar{display:none;}
.thumb{width:70px;height:70px;object-fit:cover;border-radius:7px;cursor:pointer;flex-shrink:0;transition:transform .15s,opacity .15s;}
.thumb:hover{transform:scale(1.05);opacity:0.9;}
.thumb-add{width:70px;height:70px;border-radius:7px;border:1.5px dashed var(--bg5);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text3);font-size:22px;transition:all .2s;background:var(--bg2);}
.thumb-add:hover{border-color:var(--neon-orange);color:var(--neon-orange);}
.thumb-input{display:none;}

.card-body{padding:14px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--text);line-height:1.2;flex:1;}
.card-actions{display:flex;gap:4px;transition:opacity .2s;}

.card-act-btn{background:var(--bg3);border:1px solid var(--bg4);color:var(--text3);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.card-act-btn:hover{color:var(--text);border-color:var(--bg5);}
.card-act-btn.del:hover{color:var(--neon-pink);border-color:rgba(255,45,122,.3);}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
.status-badge{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.status-badge.been{background:rgba(0,229,196,.12);color:#00e5c4;}
.status-badge.want{background:rgba(255,224,0,.1);color:#ffe000;}
.status-badge.regular{background:rgba(255,107,43,.12);color:#ff6b2b;}
.status-badge.wouldnt{background:rgba(255,45,122,.12);color:#ff2d7a;}
.status-dot{width:4px;height:4px;border-radius:50%;background:currentColor;}
.price-badge{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--bg4);padding:2px 8px;border-radius:6px;}
.card-location{font-size:12px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.card-location::before{content:'📍';font-size:11px;}
.card-rating{display:flex;gap:2px;margin-bottom:8px;}
.star{font-size:14px;color:var(--text3);cursor:pointer;transition:color .1s;}
.star.filled{color:var(--neon-yellow);}
.star:hover{color:var(--neon-yellow);}
.card-ordered{font-size:12px;color:var(--text2);margin-bottom:8px;padding:7px 10px;background:var(--bg3);border-radius:8px;border:1px solid var(--bg4);display:flex;align-items:flex-start;gap:6px;}
.card-ordered::before{content:'🍽️';font-size:12px;flex-shrink:0;margin-top:1px;}
.card-thoughts{font-size:13px;color:var(--text2);line-height:1.6;font-style:italic;border-top:1px solid var(--bg4);padding-top:9px;margin-top:4px;}

.empty-state{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4;}
.empty-state p{font-size:13px;letter-spacing:1px;text-transform:uppercase;font-family:'Syne',sans-serif;}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.95);align-items:center;justify-content:center;flex-direction:column;}
.lightbox.open{display:flex;}
.lightbox-img{max-width:94vw;max-height:78vh;object-fit:contain;border-radius:10px;}
.lightbox-nav{display:flex;align-items:center;gap:24px;margin-top:16px;}
.lb-btn{background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.lb-btn:hover{border-color:var(--neon-orange);color:var(--neon-orange);}
.lb-close{position:fixed;top:20px;right:20px;background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:501;}
.lb-close:hover{border-color:var(--neon-pink);color:var(--neon-pink);}
.lb-counter{font-size:13px;color:var(--text2);font-family:'Syne',sans-serif;letter-spacing:2px;}
.lb-del{background:rgba(255,45,122,.1);border:1px solid rgba(255,45,122,.2);color:var(--neon-pink);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.lb-del:hover{background:rgba(255,45,122,.2);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--bg5);border-radius:16px;padding:28px 26px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;animation:mIn .25s cubic-bezier(.34,1.3,.64,1) forwards;}
@keyframes mIn{from{opacity:0;transform:scale(.88) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);margin-bottom:22px;text-transform:uppercase;letter-spacing:1px;}
.modal-title span{color:var(--neon-orange);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;font-weight:500;font-family:'Syne',sans-serif;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;transition:border-color .2s;outline:none;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--bg5);}
.form-select option{background:var(--bg3);}
.form-textarea{resize:vertical;min-height:72px;line-height:1.6;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rating-input{display:flex;gap:6px;}
.rating-star{font-size:22px;color:var(--text3);cursor:pointer;transition:color .1s;user-select:none;}
.rating-star.filled{color:var(--neon-yellow);}

/* PHOTO UPLOAD IN MODAL */
.photo-upload-area{border:1.5px dashed var(--bg5);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.photo-upload-area:hover{border-color:var(--neon-orange);}
.photo-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.pua-icon{font-size:28px;margin-bottom:6px;}
.pua-text{font-size:12px;color:var(--text2);}
.modal-photo-previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.modal-thumb-wrap{position:relative;width:64px;height:64px;}
.modal-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;}
.modal-thumb-del{position:absolute;top:-6px;right:-6px;background:var(--neon-pink);border:none;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}

.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-save{flex:1;background:var(--neon-orange);border:none;color:#000;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;padding:12px;border-radius:8px;cursor:pointer;transition:all .2s;letter-spacing:1px;text-transform:uppercase;}
.btn-save:hover{background:#ff8550;}
.btn-cancel{background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;padding:12px 20px;border-radius:8px;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;}
.btn-cancel:hover{border-color:var(--bg5);color:var(--text);}

/* VISIT LOG */
.visit-count-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 10px;border-radius:20px;
  background:rgba(255,107,43,.15);color:var(--neon-orange);
  border:1px solid rgba(255,107,43,.35);font-weight:600;
  cursor:pointer;transition:all .2s;
}
.visit-count-chip:hover{background:rgba(255,107,43,.25);border-color:var(--neon-orange);}
.visit-count-chip .vc-icon{font-size:12px;}

.add-visit-btn{
  width:100%;margin-top:10px;
  background:rgba(255,107,43,.08);
  border:1px solid rgba(255,107,43,.3);
  color:var(--neon-orange);
  font-family:'Syne',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  padding:10px 14px;border-radius:10px;cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-visit-btn:hover{background:rgba(255,107,43,.18);border-color:var(--neon-orange);box-shadow:0 0 16px rgba(255,107,43,.15);}
.add-visit-btn .av-icon{font-size:14px;}

.visits-toggle{
  width:100%;background:none;border:none;
  color:var(--text2);font-family:'DM Sans',sans-serif;
  font-size:11px;padding:6px 2px 0;cursor:pointer;
  transition:color .15s;text-align:left;letter-spacing:.5px;
  display:flex;align-items:center;gap:5px;
}
.visits-toggle:hover{color:var(--text);}
.visits-toggle .vt-arrow{font-size:10px;transition:transform .2s;}
.visits-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.visit-item{background:var(--bg3);border:1px solid var(--bg4);border-radius:8px;padding:10px 12px;position:relative;}
.visit-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.visit-date{font-size:11px;color:var(--text2);font-weight:500;}
.visit-rating{display:flex;gap:2px;}
.visit-star{font-size:12px;color:var(--text3);}
.visit-star.filled{color:var(--neon-yellow);}
.visit-ordered{font-size:12px;color:var(--text2);line-height:1.5;margin-top:4px;}
.visit-notes{font-size:12px;color:var(--text3);font-style:italic;margin-top:3px;}
.visit-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px;transition:color .15s;}
.visit-del:hover{color:var(--neon-pink);}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
.backup-bar{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1;}
.sync-status{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.sync-dot.ok{background:var(--neon-teal);}
.sync-dot.err{background:var(--neon-pink);}
.sync-dot.loading{background:var(--neon-yellow);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.backup-btn{background:var(--bg2);border:1px solid var(--bg4);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:11px;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;}
.backup-btn:hover{border-color:var(--neon-orange);color:var(--neon-orange);}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <p class="header-eyebrow">Ahmad's Food Diary</p>
  <h1><span class="w1">Food</span> <span class="w2">&</span> <span class="w3">Places</span></h1>
  <p class="header-sub">Restaurants · Desserts · Cafes · Street Food · Caterers</p>
  <div class="header-line"></div>
</header>

<div class="backup-bar">
  <div class="sync-status"><div class="sync-dot loading" id="sync-dot"></div><span id="sync-label">Connecting...</span></div>
  <div style="display:flex;gap:8px;">
    <button class="backup-btn" onclick="exportData()">⬇ Export</button>
    <button class="backup-btn" onclick="document.getElementById('import-input').click()">⬆ Import</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)"/>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item"><span class="stat-num s1" id="st-total">0</span><span class="stat-lbl">Total</span></div>
  <div class="stat-item"><span class="stat-num s2" id="st-been">0</span><span class="stat-lbl">Visited</span></div>
  <div class="stat-item"><span class="stat-num s3" id="st-want">0</span><span class="stat-lbl">Want to Go</span></div>
  <div class="stat-item"><span class="stat-num s4" id="st-regular">0</span><span class="stat-lbl">Regulars</span></div>
  <div class="stat-item"><span class="stat-num s5" id="st-wouldnt">0</span><span class="stat-lbl">Won't Return</span></div>
</div>

<div class="tabs-wrap">
  <button class="tab-btn t-restaurants active" onclick="switchTab('restaurants',this)"><span>🍽️</span> Restaurants</button>
  <button class="tab-btn t-desserts"           onclick="switchTab('desserts',this)"><span>🍰</span> Desserts</button>
  <button class="tab-btn t-cafes"              onclick="switchTab('cafes',this)"><span>☕</span> Cafes</button>
  <button class="tab-btn t-street"             onclick="switchTab('street',this)"><span>🌮</span> Street Food</button>
  <button class="tab-btn t-caterers"           onclick="switchTab('caterers',this)"><span>🤌</span> Caterers</button>
</div>

<div class="main">
  <div id="sec-restaurants" class="section active"></div>
  <div id="sec-desserts"    class="section"></div>
  <div id="sec-cafes"       class="section"></div>
  <div id="sec-street"      class="section"></div>
  <div id="sec-caterers"    class="section"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lb-img" src="" alt=""/>
  <div class="lightbox-nav">
    <button class="lb-btn" onclick="lbNav(-1)">&#8249;</button>
    <span class="lb-counter" id="lb-counter">1 / 1</span>
    <button class="lb-btn" onclick="lbNav(1)">&#8250;</button>
    <button class="lb-del" onclick="lbDelete()" title="Delete photo">🗑</button>
  </div>
</div>

<!-- VISIT MODAL -->
<div class="modal-overlay" id="visit-modal">
  <div class="modal">
    <p class="modal-title">Log <span id="visit-modal-place">Visit</span></p>
    <input type="hidden" id="visit-entry-id"/>
    <input type="hidden" id="visit-entry-cat"/>
    <input type="hidden" id="visit-edit-id"/>
    <div class="form-group">
      <label class="form-label">Date of Visit</label>

<script>
var data={restaurants:[],desserts:[],cafes:[],street:[],caterers:[]};
var currentTab='restaurants';
var currentFilter={restaurants:'all',desserts:'all',cafes:'all',street:'all',caterers:'all'};
var editRating=0;
var editingId=null;
var modalPhotos=[];

// lightbox state
var lbPhotos=[];
var lbIndex=0;
var lbCat='';
var lbEntryId='';

var statusLabels={been:'Been Here',want:'Want to Visit',regular:'Regular Spot',wouldnt:"Won't Return"};
var tabLabels={restaurants:'Restaurant',desserts:'Dessert Place',cafes:'Cafe',street:'Street Food Spot',caterers:'Caterer'};
var tabIcons={restaurants:'🍽️',desserts:'🍰',cafes:'☕',street:'🌮',caterers:'🤌'};

var SB_URL='https://oludgjpyrennjfkizmas.supabase.co';
var SB_KEY='sb_publishable_iPOfDAFeSbuFD95Ibnr05w_U9fQHHvJ';
function sbFetch(path,opts){
  return fetch(SB_URL+path,Object.assign({headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'}},opts));
}

function saveLocal(){try{localStorage.setItem('ahmads-food2',JSON.stringify(data));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

function setSyncStatus(state,msg){
  var dot=document.getElementById('sync-dot');
  var lbl=document.getElementById('sync-label');
  if(!dot||!lbl)return;
  dot.className='sync-dot '+state;
  lbl.textContent=msg;
}

async function load(){
  setSyncStatus('loading','Connecting...');
  try{
    var res=await sbFetch('/rest/v1/food?select=*&order=created_at.desc');
    if(!res.ok)throw new Error();
    var rows=await res.json();
    data={restaurants:[],desserts:[],cafes:[],street:[],caterers:[]};
    rows.forEach(function(r){
      if(data[r.cat]!==undefined) data[r.cat].push({
        id:r.id,title:r.title,status:r.status,price:r.price||'',
        location:r.location||'',ordered:r.ordered||'',
        rating:r.rating||0,thoughts:r.thoughts||'',
        photos:r.photos?JSON.parse(r.photos):[],
        visits:r.visits?JSON.parse(r.visits):[]
      });
    });
    saveLocal();
    setSyncStatus('ok','Synced');
  }catch(e){
    setSyncStatus('err','Offline — local data');
    try{var s=localStorage.getItem('ahmads-food2');if(s)data=JSON.parse(s);}catch(ex){}
  }
}

function switchTab(cat,btn){
  currentTab=cat;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.getElementById('sec-'+cat).classList.add('active');
  renderSection(cat);
}

function setFilter(cat,status,el){
  currentFilter[cat]=status;
  el.closest('.filter-pills').querySelectorAll('.pill').forEach(function(p){p.classList.remove('active-filter');});
  el.classList.add('active-filter');
  renderSection(cat);
}

function renderSection(cat){
  var sec=document.getElementById('sec-'+cat);
  var filter=currentFilter[cat];
  var entries=data[cat];
  var filtered=filter==='all'?entries:entries.filter(function(e){return e.status===filter;});

  var statuses=[{k:'all',l:'All'},{k:'been',l:'Visited'},{k:'want',l:'Want to Go'},{k:'regular',l:'Regular'},{k:'wouldnt',l:"Won't Return"}];
  var html='<div class="filter-row"><div class="filter-pills">';
  statuses.forEach(function(s){
    var cls='pill '+(s.k==='all'?'all':s.k)+(currentFilter[cat]===s.k?' active-filter':'');
    html+='<span class="'+cls+'" onclick="setFilter(\''+cat+'\',\''+s.k+'\',this)">'+s.l+'</span>';
  });
  html+='</div><button class="add-btn" onclick="openModal(\''+cat+'\',null)">+ Add</button></div>';
  html+='<div class="entries-grid">';
  if(!filtered.length){
    html+='<div class="empty-state"><div class="empty-icon">'+tabIcons[cat]+'</div><p>No '+tabLabels[cat].toLowerCase()+'s logged yet</p></div>';
  }else{
    filtered.forEach(function(e){html+=renderCard(e,cat);});
  }
  html+='</div>';
  sec.innerHTML=html;
  updateStats();
}

function getAvgRating(e){
  var visits=e.visits||[];
  if(!visits.length) return e.rating||0;
  var rated=visits.filter(function(v){return v.rating>0;});
  if(!rated.length) return e.rating||0;
  return Math.round(rated.reduce(function(s,v){return s+v.rating;},0)/rated.length*10)/10;
}
function getLastVisited(e){
  var visits=e.visits||[];
  if(!visits.length) return null;
  return visits.slice().sort(function(a,b){return b.date>a.date?1:-1;})[0].date;
}
function formatVisitDate(d){
  if(!d)return '';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function renderCard(e,cat){
  var visits=e.visits||[];
  var visitCount=visits.length;
  var avgRating=getAvgRating(e);
  var lastVisited=getLastVisited(e);
  var stars='';
  for(var i=1;i<=5;i++) stars+='<span class="star'+(i<=avgRating?' filled':'')+'" onclick="quickRate(\''+cat+'\',\''+e.id+'\','+i+')">★</span>';

  var photos=e.photos||[];
  var photoStrip='';
  if(photos.length){
    photoStrip='<div class="card-photos">';
    photos.forEach(function(p,idx){
      photoStrip+='<img class="thumb" src="'+p+'" loading="lazy" onclick="openLightbox(\''+cat+'\',\''+e.id+'\','+idx+')" alt="Photo '+(idx+1)+'"/>';
    });
    photoStrip+='<div class="thumb-add" onclick="triggerCardPhotoAdd(\''+cat+'\',\''+e.id+'\')" title="Add photo">+</div>';
    photoStrip+='<input type="file" class="thumb-input" id="cpi-'+e.id+'" accept="image/*" multiple onchange="handleCardPhotoAdd(event,\''+cat+'\',\''+e.id+'\')">';
    photoStrip+='</div>';
  }else{
    photoStrip='<div class="card-photos">'
      +'<div class="thumb-add" onclick="triggerCardPhotoAdd(\''+cat+'\',\''+e.id+'\')" title="Add photo" style="margin:4px;">📷 Add Photo</div>'
      +'<input type="file" class="thumb-input" id="cpi-'+e.id+'" accept="image/*" multiple onchange="handleCardPhotoAdd(event,\''+cat+'\',\''+e.id+'\')">'
      +'</div>';
  }

  // visits list HTML
  var visitsHtml='';
  if(visitCount>0){
    var sorted=visits.slice().sort(function(a,b){return b.date>a.date?1:-1;});
    visitsHtml+='<button class="visits-toggle" onclick="toggleVisits(\''+e.id+'\')"><span class="vt-arrow">▸</span> Visit history · Last: '+formatVisitDate(lastVisited)+'</button>';
    visitsHtml+='<div class="visits-list" id="vl-'+e.id+'" style="display:none;">';
    sorted.forEach(function(v){
      var vstars='';
      for(var i=1;i<=5;i++) vstars+='<span class="visit-star'+(i<=v.rating?' filled':'')+'" >★</span>';
      visitsHtml+='<div class="visit-item">';
      visitsHtml+='<button class="visit-del" onclick="deleteVisit(\''+cat+'\',\''+e.id+'\',\''+v.id+'\')">✕</button>';
      visitsHtml+='<div class="visit-item-header"><span class="visit-date">'+formatVisitDate(v.date)+'</span><div class="visit-rating">'+vstars+'</div></div>';
      if(v.ordered) visitsHtml+='<div class="visit-ordered">'+esc(v.ordered)+'</div>';
      if(v.notes) visitsHtml+='<div class="visit-notes">'+esc(v.notes)+'</div>';
      visitsHtml+='</div>';
    });
    visitsHtml+='</div>';
  }

  return '<div class="entry-card '+e.status+'">'
    +photoStrip
    +'<div class="card-body">'
    +'<div class="card-top">'
      +'<div class="card-title">'+esc(e.title)+'</div>'
      +'<div class="card-actions">'
        +'<button class="card-act-btn" onclick="openModal(\''+cat+'\',\''+e.id+'\')">✎</button>'
        +'<button class="card-act-btn del" onclick="deleteEntry(\''+cat+'\',\''+e.id+'\')">✕</button>'
      +'</div>'
    +'</div>'
    +'<div class="card-meta">'
      +'<span class="status-badge '+e.status+'"><span class="status-dot"></span>'+statusLabels[e.status]+'</span>'
      +(e.price?'<span class="price-badge">'+esc(e.price)+'</span>':'')
      +(visitCount>0?'<span class="visit-count-chip" onclick="toggleVisits(\''+e.id+'\')"><span class="vc-icon">🔁</span>'+visitCount+' visit'+(visitCount>1?'s':'')+'</span>':'')
    +'</div>'
    +(e.location?'<div class="card-location">'+esc(e.location)+'</div>':'')
    +'<div class="card-rating">'+stars+(avgRating>0?'<span style="font-size:11px;color:var(--neon-yellow);margin-left:5px;">'+avgRating+'</span>':'')+'</div>'
    +(e.ordered&&!visitCount?'<div class="card-ordered">'+esc(e.ordered)+'</div>':'')
    +(e.thoughts?'<div class="card-thoughts">'+esc(e.thoughts)+'</div>':'')
    +visitsHtml
    +'<button class="add-visit-btn" onclick="openVisitModal(\''+cat+'\',\''+e.id+'\',null)"><span class="av-icon">📅</span> Log a New Visit</button>'
    +'</div>'
  +'</div>';
}

function toggleVisits(id){
  var el=document.getElementById('vl-'+id);
  var btn=el?el.previousElementSibling:null;
  if(!el)return;
  var open=el.style.display==='none';
  el.style.display=open?'flex':'none';
  if(btn) btn.textContent=btn.textContent.replace(open?'▸':'▾',open?'▾':'▸');
}

// ---- VISIT MODAL ----
var visitRating=0;

function openVisitModal(cat,entryId,visitId){
  document.getElementById('visit-entry-id').value=entryId;
  document.getElementById('visit-entry-cat').value=cat;
  document.getElementById('visit-edit-id').value=visitId||'';
  var entry=data[cat].find(function(e){return e.id===entryId;});
  document.getElementById('visit-modal-place').textContent=entry?esc(entry.title):'Visit';
  visitRating=0;
  if(visitId){
    var v=(entry.visits||[]).find(function(x){return x.id===visitId;});
    if(v){
      document.getElementById('visit-date').value=v.date||todayDateStr();
      document.getElementById('visit-ordered').value=v.ordered||'';
      document.getElementById('visit-notes').value=v.notes||'';
      visitRating=v.rating||0;
    }
  }else{
    document.getElementById('visit-date').value=todayDateStr();
    document.getElementById('visit-ordered').value='';
    document.getElementById('visit-notes').value='';
  }
  updateVisitRatingStars(visitRating);
  document.getElementById('visit-modal').classList.add('open');
  setTimeout(function(){document.getElementById('visit-ordered').focus();},100);
}

function closeVisitModal(){document.getElementById('visit-modal').classList.remove('open');}
document.getElementById('visit-modal').addEventListener('click',function(e){if(e.target===this)closeVisitModal();});

document.querySelectorAll('.visit-rating-star').forEach(function(star){
  star.addEventListener('click',function(){visitRating=parseInt(this.getAttribute('data-v'));updateVisitRatingStars(visitRating);});
  star.addEventListener('mouseover',function(){updateVisitRatingStars(parseInt(this.getAttribute('data-v')));});
});
document.getElementById('visit-rating-input').addEventListener('mouseleave',function(){updateVisitRatingStars(visitRating);});
function updateVisitRatingStars(val){
  document.querySelectorAll('.visit-rating-star').forEach(function(s){s.classList.toggle('filled',parseInt(s.getAttribute('data-v'))<=val);});
}

function todayDateStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function saveVisit(){
  var cat=document.getElementById('visit-entry-cat').value;
  var entryId=document.getElementById('visit-entry-id').value;
  var visitId=document.getElementById('visit-edit-id').value;
  var entry=data[cat].find(function(e){return e.id===entryId;});
  if(!entry)return;
  if(!entry.visits)entry.visits=[];
  var visit={
    id:visitId||uid(),
    date:document.getElementById('visit-date').value||todayDateStr(),
    ordered:document.getElementById('visit-ordered').value.trim(),
    rating:visitRating,
    notes:document.getElementById('visit-notes').value.trim()
  };
  if(visitId){
    var idx=entry.visits.findIndex(function(x){return x.id===visitId;});
    if(idx>-1)entry.visits[idx]=visit;
  }else{
    entry.visits.push(visit);
  }
  // update entry status to regular if they keep coming back
  if(entry.visits.length>=2&&entry.status==='been') entry.status='regular';
  saveLocal();
  // sync to supabase — store visits as JSON in the ordered field isn't ideal, use a dedicated column
  sbFetch('/rest/v1/food?id=eq.'+entryId,{method:'PATCH',body:JSON.stringify({visits:JSON.stringify(entry.visits),status:entry.status})}).catch(function(){});
  closeVisitModal();renderSection(cat);
}

function deleteVisit(cat,entryId,visitId){
  if(!confirm('Remove this visit?'))return;
  var entry=data[cat].find(function(e){return e.id===entryId;});
  if(!entry||!entry.visits)return;
  entry.visits=entry.visits.filter(function(v){return v.id!==visitId;});
  saveLocal();
  sbFetch('/rest/v1/food?id=eq.'+entryId,{method:'PATCH',body:JSON.stringify({visits:JSON.stringify(entry.visits)})}).catch(function(){});
  renderSection(cat);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ---- SUPABASE STORAGE PHOTO HANDLING ----
async function uploadPhotoToStorage(file, entryId){
  var ext = file.name.split('.').pop() || 'jpg';
  var path = 'food/' + entryId + '/' + uid() + '.' + ext;
  var res = await fetch(SB_URL+'/storage/v1/object/Photos/'+path, {
    method: 'POST',
    headers: {'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY, 'Content-Type': file.type},
    body: file
  });
  if (!res.ok) throw new Error('Upload failed');
  return SB_URL+'/storage/v1/object/public/Photos/'+path;
}

async function deletePhotoFromStorage(url){
  var path = url.split('/object/public/photos/')[1];
  if (!path) return;
  try {
    await fetch(SB_URL+'/storage/v1/object/Photos/'+path, {
      method: 'DELETE',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY}
    });
  } catch(e){}
}

async function handlePhotoUpload(event){
  var files = Array.from(event.target.files);
  var tempId = editingId || ('temp-'+uid());
  for (var i=0; i<files.length; i++){
    try {
      var url = await uploadPhotoToStorage(files[i], tempId);
      modalPhotos.push(url);
      renderModalPreviews();
    } catch(e){ alert('Photo upload failed — check your connection'); }
  }
  event.target.value='';
}

function renderModalPreviews(){
  var wrap=document.getElementById('modal-photo-previews');
  wrap.innerHTML='';
  modalPhotos.forEach(function(p,i){
    var w=document.createElement('div'); w.className='modal-thumb-wrap';
    var img=document.createElement('img'); img.className='modal-thumb'; img.src=p;
    var del=document.createElement('button'); del.className='modal-thumb-del'; del.textContent='✕';
    del.onclick=function(){ modalPhotos.splice(i,1); renderModalPreviews(); };
    w.appendChild(img); w.appendChild(del); wrap.appendChild(w);
  });
}

function triggerCardPhotoAdd(cat,id){
  var inp=document.getElementById('cpi-'+id);
  if(inp) inp.click();
}

async function handleCardPhotoAdd(event,cat,id){
  var files=Array.from(event.target.files);
  var entry=data[cat].find(function(e){return e.id===id;});
  if(!entry)return;
  if(!entry.photos)entry.photos=[];
  for(var i=0;i<files.length;i++){
    try{
      var url=await uploadPhotoToStorage(files[i],id);
      entry.photos.push(url);
      // save photo URLs to DB
      var sbRow={photos:JSON.stringify(entry.photos)};
      sbFetch('/rest/v1/food?id=eq.'+id,{method:'PATCH',body:JSON.stringify(sbRow)}).catch(function(){});
      saveLocal();
      renderSection(cat);
    }catch(e){alert('Photo upload failed');}
  }
  event.target.value='';
}

// ---- LIGHTBOX ----
function openLightbox(cat,id,idx){
  var entry=data[cat].find(function(e){return e.id===id;});
  if(!entry||!entry.photos||!entry.photos.length)return;
  lbPhotos=entry.photos; lbIndex=idx; lbCat=cat; lbEntryId=id;
  showLbPhoto(); document.getElementById('lightbox').classList.add('open');
}

function showLbPhoto(){
  document.getElementById('lb-img').src=lbPhotos[lbIndex];
  document.getElementById('lb-counter').textContent=(lbIndex+1)+' / '+lbPhotos.length;
}

function lbNav(dir){ lbIndex=(lbIndex+dir+lbPhotos.length)%lbPhotos.length; showLbPhoto(); }

async function lbDelete(){
  if(!confirm('Delete this photo?'))return;
  var entry=data[lbCat].find(function(e){return e.id===lbEntryId;});
  if(entry){
    var url=entry.photos[lbIndex];
    entry.photos.splice(lbIndex,1);
    await deletePhotoFromStorage(url);
    sbFetch('/rest/v1/food?id=eq.'+lbEntryId,{method:'PATCH',body:JSON.stringify({photos:JSON.stringify(entry.photos)})}).catch(function(){});
    saveLocal();
    if(!entry.photos.length){closeLightbox();renderSection(lbCat);return;}
    lbPhotos=entry.photos; lbIndex=Math.min(lbIndex,lbPhotos.length-1);
    showLbPhoto(); renderSection(lbCat);
  }
}

function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
var lbTouchX=null;
document.getElementById('lightbox').addEventListener('touchstart',function(e){lbTouchX=e.touches[0].clientX;},{passive:true});
document.getElementById('lightbox').addEventListener('touchend',function(e){
  if(lbTouchX===null)return;
  var dx=e.changedTouches[0].clientX-lbTouchX;
  if(Math.abs(dx)>50)lbNav(dx<0?1:-1);
  lbTouchX=null;
},{passive:true});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowLeft')lbNav(-1);
  if(e.key==='ArrowRight')lbNav(1);
  if(e.key==='Escape')closeLightbox();
});

// ---- MODAL ----
function openModal(cat,id){
  editingId=id;
  modalPhotos=[];
  document.getElementById('edit-cat').value=cat;
  document.getElementById('modal-cat-label').textContent=tabLabels[cat];
  if(id){
    var e=data[cat].find(function(x){return x.id===id;});
    document.getElementById('f-title').value=e.title;
    document.getElementById('f-cat').value=cat;
    document.getElementById('f-status').value=e.status;
    document.getElementById('f-price').value=e.price||'';
    document.getElementById('f-location').value=e.location||'';
    document.getElementById('f-ordered').value=e.ordered||'';
    document.getElementById('f-thoughts').value=e.thoughts||'';
    editRating=e.rating||0;
    modalPhotos=(e.photos||[]).slice();
  }else{
    document.getElementById('f-title').value='';
    document.getElementById('f-cat').value=cat;
    document.getElementById('f-status').value='been';
    document.getElementById('f-price').value='';
    document.getElementById('f-location').value='';
    document.getElementById('f-ordered').value='';
    document.getElementById('f-thoughts').value='';
    editRating=0;
    modalPhotos=[];
  }
  updateRatingStars(editRating);
  renderModalPreviews();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(function(){document.getElementById('f-title').focus();},100);
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;modalPhotos=[];}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

document.querySelectorAll('.rating-star').forEach(function(star){
  star.addEventListener('click',function(){editRating=parseInt(this.getAttribute('data-v'));updateRatingStars(editRating);});
  star.addEventListener('mouseover',function(){updateRatingStars(parseInt(this.getAttribute('data-v')));});
});
document.getElementById('rating-input').addEventListener('mouseleave',function(){updateRatingStars(editRating);});
function updateRatingStars(val){
  document.querySelectorAll('.rating-star').forEach(function(s){s.classList.toggle('filled',parseInt(s.getAttribute('data-v'))<=val);});
}

function saveEntry(){
  var originalCat=document.getElementById('edit-cat').value;
  var newCat=document.getElementById('f-cat').value;
  var title=document.getElementById('f-title').value.trim();
  if(!title){document.getElementById('f-title').focus();return;}
  var existing=editingId?(data[originalCat]||[]).find(function(e){return e.id===editingId;}):null;
  var entry={
    id:editingId||uid(),cat:newCat,title:title,
    status:document.getElementById('f-status').value,
    price:document.getElementById('f-price').value,
    location:document.getElementById('f-location').value.trim(),
    ordered:document.getElementById('f-ordered').value.trim(),
    rating:editRating,
    thoughts:document.getElementById('f-thoughts').value.trim(),
    photos:modalPhotos.slice(),
    visits:existing?existing.visits||[]:[]
  };
  var sbRow={id:entry.id,cat:newCat,title:entry.title,status:entry.status,price:entry.price,location:entry.location,ordered:entry.ordered,rating:entry.rating,thoughts:entry.thoughts,photos:JSON.stringify(entry.photos),visits:JSON.stringify(entry.visits||[])};
  if(editingId){
    // if category changed, remove from old cat and add to new
    if(newCat!==originalCat){
      data[originalCat]=data[originalCat].filter(function(e){return e.id!==editingId;});
      data[newCat].unshift(entry);
    }else{
      var idx=data[originalCat].findIndex(function(e){return e.id===editingId;});
      if(idx>-1)data[originalCat][idx]=entry;
    }
    sbFetch('/rest/v1/food?id=eq.'+editingId,{method:'PATCH',body:JSON.stringify(sbRow)}).catch(function(){});
  }else{
    data[newCat].unshift(entry);
    sbFetch('/rest/v1/food',{method:'POST',body:JSON.stringify(sbRow)}).catch(function(){});
  }
  saveLocal();closeModal();
  // re-render whatever tab is currently active
  renderSection(currentTab);
  updateStats();
}

function deleteEntry(cat,id){
  if(!confirm('Remove this place? This cannot be undone.'))return;
  data[cat]=data[cat].filter(function(e){return e.id!==id;});
  saveLocal();renderSection(cat);
  sbFetch('/rest/v1/food?id=eq.'+id,{method:'DELETE'}).catch(function(){});
}

function quickRate(cat,id,r){
  var e=data[cat].find(function(x){return x.id===id;});
  if(!e)return;
  e.rating=r;saveLocal();renderSection(cat);
  sbFetch('/rest/v1/food?id=eq.'+id,{method:'PATCH',body:JSON.stringify({rating:r})}).catch(function(){});
}

function updateStats(){
  var all=[].concat(data.restaurants,data.desserts,data.cafes,data.street,data.caterers);
  document.getElementById('st-total').textContent=all.length;
  document.getElementById('st-been').textContent=all.filter(function(e){return e.status==='been';}).length;
  document.getElementById('st-want').textContent=all.filter(function(e){return e.status==='want';}).length;
  document.getElementById('st-regular').textContent=all.filter(function(e){return e.status==='regular';}).length;
  document.getElementById('st-wouldnt').textContent=all.filter(function(e){return e.status==='wouldnt';}).length;
}

function exportData(){
  var exportData=JSON.parse(JSON.stringify(data));
  ['restaurants','desserts','cafes','street','caterers'].forEach(function(cat){exportData[cat].forEach(function(e){e.photos=[];});});
  var blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ahmads-food-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
}
async function importData(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(imported.restaurants!==undefined){
        var cats=['restaurants','desserts','cafes','street','caterers'];
        for(var c=0;c<cats.length;c++){
          var cat=cats[c];
          for(var i=0;i<(imported[cat]||[]).length;i++){
            var item=imported[cat][i];
            try{sbFetch('/rest/v1/food',{method:'POST',body:JSON.stringify({id:item.id,cat:cat,title:item.title,status:item.status,price:item.price||'',location:item.location||'',ordered:item.ordered||'',rating:item.rating||0,thoughts:item.thoughts||''})}).catch(function(){});}catch(ex){}
          }
        }
        await load();renderSection(currentTab);
        alert('Data restored!');
      }
    }catch(err){alert('Could not read file');}
  };
  reader.readAsText(file);event.target.value='';
}

load().then(function(){renderSection('restaurants');});
</script>
